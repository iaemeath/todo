<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>岁月史书 - Antigravity Todo 展览馆</title>
  <link rel="stylesheet" href="./style.css?v=2">
</head>
<body>
  <header class="museum-header">
    <a href="/" class="back-link">← 返回真实的现代世界 (主应用)</a>
    <h1>🏛️ Antigravity Todo 岁月史书</h1>
    <p>“展览过去的版本，记录过去的不易。”</p>
  </header>

  <main class="exhibition-hall">
    <!-- V1: 初代版本 -->
    <div class="exhibit">
      <div class="exhibit-title">
        <h2>V1: 混沌初开</h2>
        <span class="badge">基础列表时代</span>
      </div>
      <div class="device-frame">
        <button class="maximize-btn" onclick="openFullscreen('./v1/index.html')" title="全屏查看">🔍</button>
        <div class="device-screen">
          <iframe src="./v1/index.html" frameborder="0"></iframe>
        </div>
      </div>
      <p class="exhibit-desc">最初的样子，只有最基础的 Todo 列表。代码简陋，但它是梦开始的地方。</p>
    </div>

    <!-- V2: Canvas 架构 -->
    <div class="exhibit">
      <div class="exhibit-title">
        <h2>V2: 架构涅槃</h2>
        <span class="badge">Canvas 重写版</span>
      </div>
      <div class="device-frame">
        <button class="maximize-btn" onclick="openFullscreen('./v2/index.html')" title="全屏查看">🔍</button>
        <div class="device-screen">
          <iframe src="./v2/index.html" frameborder="0"></iframe>
        </div>
      </div>
      <p class="exhibit-desc">彻底推翻了 HTML DOM，采用硬核的 Canvas 引擎渲染，追求极致的性能与自由度。</p>
    </div>

    <!-- V3: 现代终极版 -->
    <div class="exhibit current-era">
      <div class="exhibit-title">
        <h2>V3: 繁星璀璨</h2>
        <span class="badge active">当今版本</span>
      </div>
      <div class="device-frame">
        <button class="maximize-btn" onclick="openFullscreen('/')" title="全屏查看">🔍</button>
        <div class="device-screen">
          <iframe src="/" frameborder="0"></iframe>
        </div>
      </div>
      <p class="exhibit-desc">接入了 FullCalendar、离线大模型 WebLLM、响应式交互，并重铸了玻璃拟物态的终极形态。</p>
    </div>
  </main>

  <script>
    function openFullscreen(src) {
      const overlay = document.createElement('div');
      overlay.className = 'fullscreen-overlay';
      overlay.innerHTML = `
        <button class="close-fullscreen-btn" onclick="this.parentElement.remove()">✕</button>
        <iframe src="${src}" frameborder="0"></iframe>
      `;
      document.body.appendChild(overlay);
    }
  </script>
</body>
</html>
