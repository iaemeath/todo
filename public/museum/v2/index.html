<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Todo V2 (Canvas Edition)</title>
  <style>
    body { margin: 0; padding: 0; background: #1a1a1a; color: white; font-family: monospace; overflow: hidden; }
    #toolbar { position: absolute; top: 10px; left: 10px; z-index: 10; }
    input { background: #333; color: #0f0; border: 1px solid #0f0; padding: 5px; }
    button { background: #0f0; color: #000; border: none; padding: 6px 12px; cursor: pointer; font-weight: bold; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <div id="toolbar">
    <input type="text" id="taskInput" placeholder="New Canvas Task...">
    <button onclick="addTask()">Render()</button>
    <span>[V2 架构: 纯 Canvas 渲染, 0 DOM 节点]</span>
  </div>
  <canvas id="appCanvas"></canvas>
  <script>
    const canvas = document.getElementById('appCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let tasks = [
      { text: "重构渲染引擎", x: 50, y: 100, vx: 2, vy: 1.5, color: "#ff0055" },
      { text: "脱离 DOM 束缚", x: 200, y: 200, vx: -1.5, vy: 2, color: "#00ffcc" }
    ];

    function addTask() {
      const input = document.getElementById('taskInput');
      if (!input.value) return;
      tasks.push({
        text: input.value,
        x: Math.random() * (canvas.width - 100),
        y: Math.random() * (canvas.height - 100),
        vx: (Math.random() - 0.5) * 4,
        vy: (Math.random() - 0.5) * 4,
        color: `hsl(${Math.random() * 360}, 100%, 50%)`
      });
      input.value = '';
    }

    function render() {
      ctx.fillStyle = "rgba(26, 26, 26, 0.2)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      tasks.forEach(task => {
        task.x += task.vx;
        task.y += task.vy;

        if (task.x <= 0 || task.x >= canvas.width - 150) task.vx *= -1;
        if (task.y <= 0 || task.y >= canvas.height - 30) task.vy *= -1;

        ctx.fillStyle = task.color;
        ctx.font = "16px monospace";
        ctx.fillText("■ " + task.text, task.x, task.y);
      });

      requestAnimationFrame(render);
    }
    render();

    window.onresize = () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
  </script>
</body>
</html>
