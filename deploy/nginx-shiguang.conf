# 拾光（todo）nginx 部署配置 — Windows nginx，参照 calendarWeekly 结构
# 差异要点：本项目是纯前端 SPA（无 PWA，纯 HTTP 下 SW 本就不可用），无后端 API
# （AI 由浏览器直连 DeepSeek HTTPS），缓存策略只需覆盖静态产物。
#
# 部署：解压 shiguang-dist-v4.0.1.zip 的全部内容到 D:/scp/www/shiguang
# （dist 内容必须在站点根——vite 未配 base，资源按绝对路径 /assets/... 引用）

server {
    listen 80;
    server_name shiguang.rl.ylh.pub;   # 按实际域名改

    root "D:/scp/www/shiguang";
    index index.html;

    # SPA 前端回退（本项目无 vue-router，纯保险）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带内容哈希的构建产物：文件名变即内容变，可永久缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 入口页必须每次回源校验，否则发新版后用户一直跑旧 index.html
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}

# 注意事项：
# 1. 若要部署到子路径（如 /todo/），必须给 vite.config.ts 配 base 后重新构建。
# 2. zip 由 PowerShell Compress-Archive 打包，条目分隔符为反斜杠——Windows 服务器
#    解压无碍；若目标改 Linux nginx，建议用 7-Zip/ unzip 兼容工具重新打包。
