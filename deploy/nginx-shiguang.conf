# 拾光 nginx 部署配置 — Windows nginx。一个站点三角色：
# ① 静态 SPA：dist 内容在站点根（vite base './' 相对路径，一份产物桌面/web 两用）
# ② /api/ 反代本机 Node 后端（server/，Express + node:sqlite，127.0.0.1:8787，
#    不直接暴露公网；纯 Bearer 认证无 Cookie，无需透传特殊头）
# ③ /updates/ 桌面自动更新源（electron-updater feed：
#    latest.yml + 拾光-Setup-*.exe + .blockmap 三件套放此目录）
#
# 协议事实：纯 HTTP（listen 80，无证书）。桌面/安卓壳 apiClient 默认地址与
# package.json build.publish 均为 http:// —— 三处必须保持一致，改协议需同步改。
#
# 部署：dist 内容 + updates/ 三件套解压到 D:/scp/www/shiguang
# （dist 必须在站点根——vite base './'，资源按相对路径引用）

server {
    listen 80;
    server_name shiguang.rl.ylh.pub;   # 按实际域名改

    root "D:/scp/www/shiguang";
    index index.html;

    # SPA 前端回退（hash 路由下纯保险）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带内容哈希的构建产物：文件名变即内容变，可永久缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 入口页必须每次回源校验，否则发新版后用户一直跑旧 index.html
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 后端 API 反代（与 vite dev 的 /api proxy、server/index.ts 监听端口一致）
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 桌面更新源：yml 禁缓存（autoUpdater 每 6h 拉一次，缓存会延迟发现新版）
    location /updates/ {
        add_header Cache-Control "no-cache";
        types {
            text/yaml yml;
        }
    }
}

# 注意事项：
# 1. 若部署到子路径（如 /todo/），必须给 vite.config.ts 配 base 后重新构建。
# 2. 部署 zip 由 PowerShell Compress-Archive 打包，条目分隔符为反斜杠——Windows 服务器
#    解压无碍；若目标改 Linux nginx，建议用 7-Zip/unzip 兼容工具重新打包。
# 3. 后端常驻方式（当前为手工/脚本启动 server/）：建议配 NSSM 注册为 Windows 服务，
#    崩溃自拉起；本配置只管 HTTP 入口。
